<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <style>
    text { font-family: monospace; font-size: 10px; fill: #e0e0e0; }
    .label { font-size: 9px; fill: #888; }
    .small { font-size: 7px; fill: #666; }
    .title { font-size: 14px; fill: #fff; font-weight: bold; }
    .dim { stroke: #666; stroke-width: 0.5; fill: none; }
  </style>

  <rect width="500" height="500" fill="#1a1a1a"/>

  <text x="250" y="25" text-anchor="middle" class="title">Alert Patch — Enclosure Design</text>

  <!-- ===== TOP VIEW (left) ===== -->
  <text x="100" y="55" text-anchor="middle" class="label">Top View</text>

  <!-- TPU outer ring (ø32mm) -->
  <circle cx="105" cy="155" r="48" fill="#2d3a2d" stroke="#4d7a4d" stroke-width="2"/>
  <!-- TPU inner area (slightly translucent) -->
  <circle cx="105" cy="155" r="44" fill="#3a4a3a" stroke="#4d7a4d" stroke-width="1"/>

  <!-- PCB outline visible through case -->
  <rect x="75" y="125" width="60" height="60" rx="4" fill="none" stroke="#4a8a4a" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- nRF52 -->
  <rect x="90" y="140" width="22" height="22" rx="2" fill="none" stroke="#6a8aff" stroke-width="0.8"/>
  <text x="101" y="155" text-anchor="middle" class="small" fill="#8af">MCU</text>

  <!-- Battery outline -->
  <rect x="68" y="105" width="30" height="25" rx="3" fill="none" stroke="#aaa" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="83" y="120" text-anchor="middle" class="small" fill="#aaa">CR1220</text>

  <!-- Sensor opening (bottom) -->
  <rect x="85" y="175" width="20" height="12" rx="2" fill="#1a1a1a" stroke="#fea" stroke-width="1"/>
  <text x="95" y="184" text-anchor="middle" class="small" fill="#fea">SENSOR</text>
  <!-- Opening label -->
  <line x1="95" y1="187" x2="95" y2="200" stroke="#fea" stroke-width="0.5"/>
  <text x="40" y="210" font-size="7" fill="#fea">skin contact opening</text>

  <!-- Adhesive layer ring -->
  <circle cx="105" cy="155" r="48" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="155" y="120" class="small" fill="#888">CGM adhesive strip</text>

  <!-- Dimensions -->
  <line x1="47" y1="107" x2="47" y2="203" class="dim"/>
  <line x1="42" y1="107" x2="52" y2="107" class="dim"/>
  <line x1="42" y1="203" x2="52" y2="203" class="dim"/>
  <text x="38" y="155" text-anchor="middle" transform="rotate(-90,38,155)" class="small">~32 mm</text>

  <line x1="47" y1="203" x2="163" y2="203" class="dim"/>
  <line x1="47" y1="198" x2="47" y2="208" class="dim"/>
  <line x1="163" y1="198" x2="163" y2="208" class="dim"/>
  <text x="105" y="218" text-anchor="middle" class="small">~32 mm</text>

  <text x="105" y="248" text-anchor="middle" class="small" fill="#666">Thickness: ~4 mm (including battery)</text>

  <!-- ===== SIDE VIEW / CROSS SECTION (right) ===== -->
  <text x="370" y="55" text-anchor="middle" class="label">Cross Section (A–A')</text>

  <!-- Skin surface -->
  <rect x="280" y="300" width="180" height="60" fill="#2d1a1a" stroke="#5a3a3a" stroke-width="0.8"/>
  <text x="370" y="340" text-anchor="middle" class="small" fill="#a66">SKIN</text>

  <!-- Sensor opening in bottom -->
  <rect x="320" y="264" width="25" height="36" fill="none" stroke="#fea" stroke-width="0.8"/>
  <text x="332" y="290" text-anchor="middle" class="small" fill="#fea">SENSOR</text>

  <!-- Adhesive layer -->
  <rect x="290" y="263" width="160" height="2" fill="#777"/>
  <text x="370" y="275" text-anchor="middle" class="small" fill="#888">adhesive</text>

  <!-- Bottom case wall -->
  <rect x="290" y="245" width="160" height="18" rx="2" fill="#2d3a2d" stroke="#4d7a4d" stroke-width="1"/>
  <!-- Left and Right Bottom Case Wall Extensions -->
  <rect x="290" y="227" width="6" height="18" fill="#2d3a2d" stroke="#4d7a4d" stroke-width="1" id="bc_left_wall" />
  <rect x="444" y="227" width="6" height="18" fill="#2d3a2d" stroke="#4d7a4d" stroke-width="1" id="bc_right_wall" />
  <!-- Step Joint Cutouts in Bottom Case -->
  <rect x="293" y="227" width="3" height="2.5" fill="#1a1a1a" id="bc_left_step" />
  <rect x="444" y="227" width="3" height="2.5" fill="#1a1a1a" id="bc_right_step" />
  <!-- Snap-Fit Groove Cutouts in Bottom Case -->
  <circle cx="293" cy="228.25" r="1.25" fill="#1a1a1a" id="bc_left_groove" />
  <circle cx="447" cy="228.25" r="1.25" fill="#1a1a1a" id="bc_right_groove" />

  <!-- PCB inside -->
  <rect x="305" y="233" width="130" height="12" rx="1" fill="#1d3a1d" stroke="#2d8a2d" stroke-width="0.8"/>
  <text x="370" y="242" text-anchor="middle" class="small" fill="#4a8a4a">PCB</text>

  <!-- nRF52 package -->
  <rect x="330" y="222" width="30" height="11" rx="1" fill="#2a2a3a" stroke="#6a6a8a" stroke-width="0.8"/>
  <text x="345" y="230" text-anchor="middle" class="small" fill="#8af">MCU</text>

  <!-- Battery -->
  <rect x="310" y="208" width="35" height="14" rx="2" fill="#3a3a3a" stroke="#aaa" stroke-width="1"/>
  <text x="327" y="218" text-anchor="middle" class="small" fill="#ccc">CR1220</text>

  <!-- Top case wall -->
  <rect x="290" y="198" width="160" height="10" rx="2" fill="#2d3a2d" stroke="#4d7a4d" stroke-width="1"/>
  <!-- Left and Right Top Case Wall Extensions -->
  <rect x="290" y="208" width="6" height="19" fill="#2d3a2d" stroke="#4d7a4d" stroke-width="1" id="tc_left_wall" />
  <rect x="444" y="208" width="6" height="19" fill="#2d3a2d" stroke="#4d7a4d" stroke-width="1" id="tc_right_wall" />
  <!-- Step Joint Lips on Top Case -->
  <rect x="293" y="227" width="3" height="2.5" fill="#2d3a2d" stroke="#4d7a4d" stroke-width="0.5" id="tc_left_lip" />
  <rect x="444" y="227" width="3" height="2.5" fill="#2d3a2d" stroke="#4d7a4d" stroke-width="0.5" id="tc_right_lip" />
  <!-- Snap-Fit Ridges on Top Case -->
  <circle cx="293" cy="228.25" r="1.0" fill="#2d3a2d" stroke="#4d7a4d" stroke-width="0.5" id="tc_left_ridge" />
  <circle cx="447" cy="228.25" r="1.0" fill="#2d3a2d" stroke="#4d7a4d" stroke-width="0.5" id="tc_right_ridge" />

  <!-- Thickness dimension -->
  <line x1="460" y1="198" x2="460" y2="300" class="dim"/>
  <line x1="455" y1="198" x2="465" y2="198" class="dim"/>
  <line x1="455" y1="300" x2="465" y2="300" class="dim"/>
  <text x="472" y="254" text-anchor="middle" class="small">~4 mm</text>

  <!-- Layer labels on side -->
  <line x1="280" y1="205" x2="270" y2="205" class="dim"/>
  <text x="260" y="208" text-anchor="end" class="small">TPU top case</text>

  <line x1="280" y1="228" x2="270" y2="228" class="dim"/>
  <text x="260" y="231" text-anchor="end" class="small">CR1220 battery</text>

  <line x1="280" y1="255" x2="270" y2="255" class="dim"/>
  <text x="260" y="258" text-anchor="end" class="small">TPU bottom case</text>

  <line x1="280" y1="298" x2="270" y2="298" class="dim"/>
  <text x="260" y="301" text-anchor="end" class="small">CGM adhesive</text>

  <!-- ===== Assembly notes at bottom ===== -->
  <text x="250" y="390" text-anchor="middle" class="label">Assembly Notes</text>

  <text x="50" y="410" class="small">1. 3D-print TPU case: 0.12 mm layer height, 95A shore hardness filament</text>
  <text x="50" y="422" class="small">2. Insert PCB into bottom case (press-fit or silicone adhesive)</text>
  <text x="50" y="434" class="small">3. Snap CR1220 into holder BEFORE sealing top case</text>
  <text x="50" y="446" class="small">4. Close top case — ultrasonic weld or medical-grade cyanoacrylate</text>
  <text x="50" y="458" class="small">5. Apply CGM adhesive strip to skin-side face</text>
  <text x="50" y="470" class="small">6. Ensure sensor window is unobstructed and flush with skin</text>
</svg>
