<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <style>
    text { font-family: monospace; font-size: 10px; fill: #e0e0e0; }
    .label { font-size: 9px; fill: #888; }
    .small { font-size: 7px; fill: #888; }
    .title { font-size: 14px; fill: #fff; font-weight: bold; }
    .wire { stroke: #4a9eff; stroke-width: 1; fill: none; }
    .vdd { stroke: #f66; stroke-width: 1.5; fill: none; }
    .dot { fill: #4a9eff; }
    .dot-vdd { fill: #f66; }
    .ic { fill: #2a2a3a; stroke: #6a6a8a; stroke-width: 1.5; rx: 3; }
    .comp { fill: #2a2a2a; stroke: #555; stroke-width: 1; }
    .cap { fill: #3a3a2a; stroke: #888; stroke-width: 0.8; }
    .res { fill: #3a2a2a; stroke: #888; stroke-width: 0.8; }
    .box { fill: none; stroke: #555; stroke-width: 0.5; stroke-dasharray: 2,2; }
  </style>
  <rect width="500" height="500" fill="#1a1a1a"/>

  <text x="250" y="22" text-anchor="middle" class="title">Cryo Alert Patch — Schematic</text>
  <text x="250" y="36" text-anchor="middle" class="label">nRF52832 + MAX30205 + CR1220</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Power Rails -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <line x1="50" y1="55" x2="460" y2="55" class="vdd"/>
  <text x="462" y="58" fill="#f66" font-size="7">VDD (3V)</text>

  <line x1="50" y1="450" x2="460" y2="450" stroke="#4a9eff" stroke-width="1.5" fill="none"/>
  <text x="462" y="453" fill="#4af" font-size="7">GND</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- CR1220 Battery (BT1) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="60" y="68" width="46" height="28" rx="3" class="comp" stroke="#aaa"/>
  <text x="83" y="85" text-anchor="middle" fill="#ccc" font-size="8">CR1220</text>
  <text x="83" y="93" text-anchor="middle" fill="#aaa" font-size="6">BT1</text>
  <line x1="72" y1="68" x2="72" y2="55" class="wire"/><circle cx="72" cy="55" r="1.5" class="dot-vdd"/>
  <line x1="95" y1="96" x2="95" y2="450" class="wire"/>
  <circle cx="95" cy="96" r="1.5" class="dot"/>
  <text x="62" y="64" fill="#f66" font-size="6">+3V</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Decoupling Capacitors C1, C2 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="120" y="45" width="8" height="12" rx="1" class="cap"/>
  <line x1="124" y1="45" x2="124" y2="55" class="wire"/><circle cx="124" cy="55" r="1.5" class="dot-vdd"/>
  <line x1="124" y1="57" x2="124" y2="450" class="wire"/>
  <text x="108" y="53" class="small">C1</text>
  <text x="106" y="60" class="small">100n</text>

  <rect x="148" y="45" width="8" height="12" rx="1" class="cap"/>
  <line x1="152" y1="45" x2="152" y2="55" class="wire"/><circle cx="152" cy="55" r="1.5" class="dot-vdd"/>
  <line x1="152" y1="57" x2="152" y2="450" class="wire"/>
  <text x="136" y="53" class="small">C2</text>
  <text x="134" y="60" class="small">10µ</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- nRF52832 — U1 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="210" y="115" width="100" height="210" rx="4" class="ic"/>
  <text x="260" y="210" text-anchor="middle" fill="#8af" font-size="9">nRF52832</text>
  <text x="260" y="223" text-anchor="middle" fill="#6af" font-size="7">QFN-48</text>
  <text x="260" y="234" text-anchor="middle" fill="#6af" font-size="7">U1</text>
  <circle cx="216" cy="121" r="2" fill="#8af"/>

  <!-- U1 VDD left -->
  <line x1="210" y1="135" x2="195" y2="135" class="wire"/><circle cx="195" cy="135" r="1.5" class="dot"/><line x1="195" y1="135" x2="195" y2="55" class="wire"/><circle cx="195" cy="55" r="1.5" class="dot-vdd"/>
  <text x="204" y="132" class="small" text-anchor="end" fill="#f66">VDD</text>
  <line x1="210" y1="150" x2="195" y2="150" class="wire"/><circle cx="195" cy="150" r="1.5" class="dot"/><line x1="195" y1="150" x2="195" y2="55" class="wire"/>

  <!-- U1 VSS left -->
  <line x1="210" y1="175" x2="195" y2="175" class="wire"/><circle cx="195" cy="175" r="1.5" class="dot"/><line x1="195" y1="175" x2="195" y2="450" class="wire"/>
  <text x="204" y="172" class="small" text-anchor="end" fill="#4af">VSS</text>
  <line x1="210" y1="190" x2="195" y2="190" class="wire"/><circle cx="195" cy="190" r="1.5" class="dot"/><line x1="195" y1="190" x2="195" y2="450" class="wire"/>

  <!-- U1 SCL (P0.16) -->
  <line x1="210" y1="243" x2="160" y2="243" class="wire"/>
  <text x="204" y="239" class="small" text-anchor="end">SCL</text>

  <!-- U1 SDA (P0.15) -->
  <line x1="210" y1="263" x2="160" y2="263" class="wire"/>
  <text x="204" y="259" class="small" text-anchor="end">SDA</text>

  <!-- U1 ANT (right) -->
  <line x1="310" y1="130" x2="330" y2="130" class="wire"/>
  <text x="315" y="127" class="small">ANT</text>

  <!-- U1 SWDCLK -->
  <line x1="310" y1="175" x2="330" y2="175" class="wire"/>
  <text x="315" y="172" class="small">SWCLK</text>

  <!-- U1 SWDIO -->
  <line x1="310" y1="195" x2="330" y2="195" class="wire"/>
  <text x="315" y="192" class="small">SWDIO</text>

  <!-- U1 RESET -->
  <line x1="310" y1="225" x2="330" y2="225" class="wire"/>
  <text x="315" y="222" class="small">RESET</text>

  <!-- U1 GPIO (LED out) -->
  <line x1="310" y1="270" x2="330" y2="270" class="wire"/>
  <text x="315" y="267" class="small">GPIO</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- MAX30205 — U2 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="80" y="205" width="55" height="65" rx="2" class="comp" fill="#2a2a3a" stroke="#8a6a3a"/>
  <text x="107" y="232" text-anchor="middle" fill="#fea" font-size="8">MAX</text>
  <text x="107" y="243" text-anchor="middle" fill="#fea" font-size="7">30205</text>
  <text x="107" y="253" text-anchor="middle" fill="#ca8" font-size="6">U2</text>

  <!-- U2 VDD -->
  <line x1="90" y1="205" x2="90" y2="55" class="wire"/><circle cx="90" cy="205" r="1.5" class="dot"/><circle cx="90" cy="55" r="1.5" class="dot-vdd"/>
  <text x="84" y="202" class="small" text-anchor="end" fill="#f66">VDD</text>

  <!-- U2 GND -->
  <line x1="90" y1="270" x2="90" y2="450" class="wire"/><circle cx="90" cy="270" r="1.5" class="dot"/>
  <text x="84" y="275" class="small" text-anchor="end" fill="#4af">GND</text>

  <!-- U2 SCL -->
  <line x1="135" y1="225" x2="150" y2="225" class="wire"/>
  <line x1="150" y1="225" x2="150" y2="243" class="wire"/><circle cx="150" cy="243" r="1.5" class="dot"/>

  <!-- U2 SDA -->
  <line x1="135" y1="248" x2="150" y2="248" class="wire"/>
  <line x1="150" y1="248" x2="150" y2="263" class="wire"/><circle cx="150" cy="263" r="1.5" class="dot"/>

  <!-- U2 ADD → GND -->
  <line x1="125" y1="270" x2="125" y2="450" class="wire"/>
  <text x="111" y="278" class="small">ADD→GND</text>
  <text x="111" y="286" class="small">(0x48)</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- I2C Pull-up Resistors R1, R2 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="140" y="83" width="14" height="6" rx="1" class="res"/>
  <line x1="147" y1="83" x2="147" y2="55" class="wire"/><circle cx="147" cy="55" r="1.5" class="dot-vdd"/>
  <line x1="147" y1="89" x2="147" y2="243" class="wire"/>
  <text x="165" y="87" class="small">R1</text>
  <text x="165" y="94" class="small">10k</text>

  <rect x="140" y="98" width="14" height="6" rx="1" class="res"/>
  <line x1="147" y1="98" x2="147" y2="55" class="wire"/><circle cx="147" cy="55" r="1.5" class="dot-vdd"/>
  <line x1="147" y1="104" x2="147" y2="263" class="wire"/>
  <text x="165" y="104" class="small">R2</text>
  <text x="165" y="111" class="small">10k</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- RESET Pull-up R3 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="330" y="105" width="14" height="6" rx="1" class="res"/>
  <line x1="337" y1="105" x2="337" y2="55" class="wire"/><circle cx="337" cy="55" r="1.5" class="dot-vdd"/>
  <line x1="337" y1="111" x2="337" y2="225" class="wire"/>
  <text x="350" y="109" class="small">R3 10k</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Antenna Matching Pi-Filter -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="345" y="140" width="14" height="6" rx="1" class="res"/>
  <line x1="352" y1="140" x2="352" y2="55" class="wire"/><circle cx="352" cy="55" r="1.5" class="dot-vdd"/>
  <line x1="352" y1="146" x2="352" y2="130" class="wire"/>

  <rect x="375" y="47" width="6" height="12" rx="1" class="cap"/>
  <line x1="378" y1="47" x2="378" y2="55" class="wire"/><circle cx="378" cy="55" r="1.5" class="dot-vdd"/>
  <line x1="378" y1="59" x2="378" y2="450" class="wire"/>

  <rect x="390" y="47" width="6" height="12" rx="1" class="cap"/>
  <line x1="393" y1="47" x2="393" y2="55" class="wire"/><circle cx="393" cy="55" r="1.5" class="dot-vdd"/>
  <line x1="393" y1="59" x2="393" y2="450" class="wire"/>

  <line x1="330" y1="130" x2="352" y2="130" class="wire"/>
  <line x1="352" y1="130" x2="378" y2="130" class="wire"/>
  <line x1="378" y1="130" x2="410" y2="130" class="wire"/>

  <text x="344" y="125" class="small" fill="#8af">L1</text>
  <text x="344" y="132" class="small" fill="#8af">3.9n</text>
  <text x="374" y="73" class="small">C4 1p</text>
  <text x="389" y="73" class="small">C5 0.8p</text>

  <!-- Antenna symbol -->
  <line x1="410" y1="130" x2="425" y2="118" class="wire"/>
  <line x1="410" y1="130" x2="425" y2="130" class="wire"/>
  <line x1="410" y1="130" x2="425" y2="142" class="wire"/>
  <text x="427" y="133" class="small" fill="#4af">ANT</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- SWD Header J1 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="315" y="340" width="76" height="50" rx="3" class="comp" stroke="#888"/>
  <text x="353" y="358" text-anchor="middle" class="small">J1 — SWD</text>
  <text x="353" y="366" text-anchor="middle" class="small">1.27mm pitch</text>

  <line x1="325" y1="350" x2="337" y2="350" class="wire"/><circle cx="337" cy="350" r="1.5" class="dot"/><line x1="337" y1="350" x2="337" y2="55" class="wire"/>
  <text x="313" y="353" class="small" text-anchor="end" fill="#f66">1 VDD</text>

  <line x1="325" y1="365" x2="330" y2="365" class="wire"/><circle cx="330" cy="365" r="1.5" class="dot"/>
  <circle cx="330" cy="195" r="1.5" class="dot"/>
  <text x="313" y="368" class="small" text-anchor="end">2 SWDIO</text>

  <line x1="325" y1="380" x2="330" y2="380" class="wire"/><circle cx="330" cy="380" r="1.5" class="dot"/>
  <circle cx="330" cy="175" r="1.5" class="dot"/>
  <text x="313" y="383" class="small" text-anchor="end">3 SWCLK</text>

  <line x1="325" y1="395" x2="337" y2="395" class="wire"/><circle cx="337" cy="395" r="1.5" class="dot"/><line x1="337" y1="395" x2="337" y2="450" class="wire"/>
  <text x="313" y="398" class="small" text-anchor="end" fill="#4af">4 GND</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LED Indicator (LED1 + R4) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="55" y="330" width="14" height="6" rx="1" class="res"/>
  <line x1="62" y1="330" x2="62" y2="55" class="wire"/><circle cx="62" cy="55" r="1.5" class="dot-vdd"/>
  <line x1="62" y1="336" x2="62" y2="355" class="wire"/>

  <polygon points="55,355 69,355 62,365" fill="#1a3a1a" stroke="#4a4" stroke-width="1"/>
  <line x1="55" y1="360" x2="69" y2="360" stroke="#4a4" stroke-width="1"/>
  <line x1="50" y1="368" x2="74" y2="368" stroke="#4a4" stroke-width="0.5"/>
  <line x1="50" y1="368" x2="55" y2="361" stroke="#4a4" stroke-width="0.5"/>
  <line x1="74" y1="368" x2="69" y2="361" stroke="#4a4" stroke-width="0.5"/>

  <line x1="62" y1="365" x2="62" y2="450" class="wire"/>

  <text x="48" y="328" class="small" text-anchor="end">R4</text>
  <text x="48" y="335" class="small" text-anchor="end">100k</text>
  <text x="75" y="359" class="small" fill="#4a4">LED1</text>
  <text x="75" y="366" class="small" fill="#4a4">GRN</text>

  <!-- GPIO → R4 connection -->
  <line x1="330" y1="270" x2="350" y2="270" class="wire"/>
  <line x1="350" y1="270" x2="350" y2="333" class="wire"/>
  <line x1="350" y1="333" x2="62" y2="333" class="wire"/>
  <circle cx="62" cy="333" r="1.5" class="dot"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Decoupling Capacitor C3 (right side) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="435" y="45" width="8" height="12" rx="1" class="cap"/>
  <line x1="439" y1="45" x2="439" y2="55" class="wire"/><circle cx="439" cy="55" r="1.5" class="dot-vdd"/>
  <line x1="439" y1="57" x2="439" y2="450" class="wire"/>
  <text x="420" y="53" class="small">C3</text>
  <text x="418" y="60" class="small">10µ</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- Title Block / Info Box -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="310" y="420" width="140" height="30" rx="2" class="box"/>
  <text x="315" y="433" class="small">Rev A — July 2026</text>
  <text x="315" y="443" class="small">Sheet 1/1</text>
</svg>
