<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <style>
    text { font-family: monospace; font-size: 10px; fill: #e0e0e0; }
    .label { font-size: 9px; fill: #888; }
    .small { font-size: 7px; fill: #666; }
    .title { font-size: 14px; fill: #fff; font-weight: bold; }
    .trace { stroke: #4a9eff; stroke-width: 1; fill: none; }
    .pwr { stroke: #e74c3c; stroke-width: 1; fill: none; }
    .gnd { stroke: #555; stroke-width: 1; fill: none; }
  </style>

  <rect width="600" height="500" fill="#1a1a1a"/>

  <text x="300" y="25" text-anchor="middle" class="title">Active Cooler — PCB Layout (40×30mm)</text>

  <!-- PCB Outline -->
  <rect x="100" y="50" width="400" height="240" rx="6" fill="#1d3a1d" stroke="#2d8a2d" stroke-width="2"/>

  <!-- ===== Power section (left) ===== -->
  <text x="130" y="75" class="small" fill="#e74c3c">── POWER ──</text>

  <!-- USB-C receptacle -->
  <rect x="105" y="85" width="30" height="40" rx="3" fill="#2a2a2a" stroke="#ccc" stroke-width="1.5"/>
  <text x="120" y="108" text-anchor="middle" fill="#ccc" font-size="6">USB-C</text>
  <text x="120" y="115" text-anchor="middle" class="small" fill="#ccc">J1</text>

  <!-- CH224K -->
  <rect x="100" y="145" width="50" height="30" rx="2" fill="#2a2a3a" stroke="#e67e22" stroke-width="1.5"/>
  <text x="125" y="160" text-anchor="middle" fill="#e67e22" font-size="8">CH224K</text>
  <text x="125" y="170" text-anchor="middle" fill="#e67e22" font-size="6">PD Trigger</text>
  <!-- CC lines from USB-C to CH224K -->
  <line x1="120" y1="125" x2="120" y2="145" class="trace"/>
  <text x="108" y="138" class="small">CC1</text>
  <line x1="130" y1="125" x2="130" y2="145" class="trace"/>
  <text x="132" y="138" class="small">CC2</text>

  <!-- VBUS from USB-C -->
  <line x1="115" y1="85" x2="115" y2="50" class="pwr"/>
  <text x="100" y="65" class="small" fill="#e74c3c">VBUS (9-12V)</text>
  <line x1="110" y1="85" x2="90" y2="85" class="pwr"/>
  <text x="75" y="82" class="small" fill="#e74c3c">GND</text>

  <!-- ===== MCU section (center) ===== -->
  <text x="250" y="75" text-anchor="middle" class="small" fill="#e74c3c">── CONTROL ──</text>

  <!-- nRF52832 -->
  <rect x="210" y="90" width="80" height="80" rx="3" fill="#2a2a3a" stroke="#6a6a8a" stroke-width="1.5"/>
  <text x="250" y="128" text-anchor="middle" fill="#8af" font-size="9">nRF52832</text>
  <text x="250" y="138" text-anchor="middle" class="small" fill="#8af">MCU</text>
  <circle cx="215" cy="95" r="2" fill="#8af"/>
  <text x="210" y="88" class="small">pin 1</text>

  <!-- Decoupling caps near MCU -->
  <rect x="220" y="175" width="10" height="8" rx="1" fill="#3a3a2a" stroke="#888" stroke-width="0.8"/>
  <text x="225" y="181" text-anchor="middle" class="small">C1</text>
  <rect x="240" y="175" width="10" height="8" rx="1" fill="#3a3a2a" stroke="#888" stroke-width="0.8"/>
  <text x="245" y="181" text-anchor="middle" class="small">C2</text>
  <rect x="260" y="175" width="10" height="8" rx="1" fill="#3a3a2a" stroke="#888" stroke-width="0.8"/>
  <text x="265" y="181" text-anchor="middle" class="small">C3</text>

  <!-- PWM out from MCU -->
  <line x1="290" y1="120" x2="330" y2="120" class="trace"/>
  <text x="295" y="115" class="small">PWM</text>

  <!-- ===== Output section (right) ===== -->
  <text x="410" y="75" text-anchor="middle" class="small" fill="#e74c3c">── OUTPUT ──</text>

  <!-- IRLZ44N MOSFET -->
  <rect x="330" y="100" width="45" height="60" rx="2" fill="#3a2a2a" stroke="#e67e22" stroke-width="1.5"/>
  <text x="352" y="130" text-anchor="middle" fill="#e67e22" font-size="7">IRLZ44N</text>
  <text x="352" y="140" text-anchor="middle" fill="#e67e22" font-size="6">MOSFET</text>
  <!-- Gate from PWM -->
  <line x1="330" y1="120" x2="330" y2="120" class="trace"/>
  <!-- Drain -->
  <line x1="375" y1="110" x2="395" y2="110" class="pwr"/>
  <text x="380" y="106" class="small" fill="#e74c3c">D</text>
  <!-- Source to GND -->
  <line x1="375" y1="150" x2="395" y2="150" class="gnd"/>
  <text x="380" y="147" class="small">S → GND</text>

  <!-- Peltier connector -->
  <rect x="395" y="95" width="30" height="40" rx="3" fill="#2a2a2a" stroke="#aaa" stroke-width="1.5"/>
  <text x="410" y="118" text-anchor="middle" fill="#ccc" font-size="7">PELTIER</text>
  <text x="410" y="126" text-anchor="middle" class="small">JST</text>

  <!-- 1N5819 Schottky (flyback diode) -->
  <rect x="330" y="170" width="30" height="15" rx="1" fill="#3a2a2a" stroke="#e67e22" stroke-width="1"/>
  <text x="345" y="180" text-anchor="middle" fill="#e67e22" font-size="6">1N5819</text>
  <line x1="345" y1="170" x2="345" y2="160" class="trace"/>
  <text x="340" y="157" class="small">D1</text>

  <!-- Fan header -->
  <rect x="395" y="155" width="25" height="30" rx="2" fill="#2a2a2a" stroke="#aaa" stroke-width="1"/>
  <text x="408" y="170" text-anchor="middle" fill="#ccc" font-size="6">FAN</text>
  <text x="408" y="178" text-anchor="middle" class="small">5V</text>

  <!-- ===== Local temp sensor (bottom left) ===== -->
  <text x="140" y="215" class="small" fill="#fea">── LOCAL SENSOR ──</text>
  <rect x="110" y="225" width="30" height="30" rx="2" fill="#2a2a3a" stroke="#8a6a3a" stroke-width="1.5"/>
  <text x="125" y="243" text-anchor="middle" fill="#fea" font-size="7">MAX</text>
  <text x="125" y="253" text-anchor="middle" fill="#fea" font-size="6">30205</text>
  <line x1="140" y1="240" x2="210" y2="160" class="trace"/>
  <text x="145" y="235" class="small">I2C</text>

  <!-- I2C pull-ups -->
  <rect x="175" y="225" width="12" height="8" rx="1" fill="#3a2a2a" stroke="#888" stroke-width="0.8"/>
  <text x="181" y="231" text-anchor="middle" class="small">R1</text>
  <rect x="195" y="225" width="12" height="8" rx="1" fill="#3a2a2a" stroke="#888" stroke-width="0.8"/>
  <text x="201" y="231" text-anchor="middle" class="small">R2</text>

  <!-- ===== Dimensions ===== -->
  <line x1="100" y1="300" x2="500" y2="300" stroke="#555" stroke-width="0.5"/>
  <line x1="100" y1="295" x2="100" y2="305" stroke="#555" stroke-width="0.5"/>
  <line x1="500" y1="295" x2="500" y2="305" stroke="#555" stroke-width="0.5"/>
  <text x="300" y="315" text-anchor="middle" class="small">40 mm</text>

  <line x1="90" y1="50" x2="90" y2="290" stroke="#555" stroke-width="0.5"/>
  <line x1="85" y1="50" x2="95" y2="50" stroke="#555" stroke-width="0.5"/>
  <line x1="85" y1="290" x2="95" y2="290" stroke="#555" stroke-width="0.5"/>
  <text x="78" y="175" text-anchor="middle" transform="rotate(-90,78,175)" class="small">30 mm</text>

  <!-- Legend -->
  <text x="20" y="345" class="label">Component Legend:</text>
  <rect x="20" y="352" width="10" height="10" fill="#2a2a3a" stroke="#6a6a8a" stroke-width="1"/><text x="35" y="361" class="small">U1: nRF52832 (MCU, BLE)</text>
  <rect x="20" y="367" width="10" height="10" fill="#2a2a2a" stroke="#ccc" stroke-width="1"/><text x="35" y="376" class="small">J1: USB-C receptacle</text>
  <rect x="20" y="382" width="10" height="10" fill="#2a2a3a" stroke="#e67e22" stroke-width="1"/><text x="35" y="391" class="small">U2: CH224K (USB-PD trigger)</text>
  <rect x="300" y="352" width="10" height="10" fill="#3a2a2a" stroke="#e67e22" stroke-width="1.5"/><text x="315" y="361" class="small">Q1: IRLZ44N (N-MOSFET)</text>
  <rect x="300" y="367" width="10" height="10" fill="#2a2a3a" stroke="#8a6a3a" stroke-width="1"/><text x="315" y="376" class="small">U3: MAX30205 (local temp)</text>
  <rect x="300" y="382" width="10" height="10" fill="#3a2a2a" stroke="#e67e22" stroke-width="1"/><text x="315" y="391" class="small">D1: 1N5819 (flyback)</text>

  <text x="20" y="425" class="label">Notes:</text>
  <text x="20" y="437" class="small">• 2-layer PCB, ENIG finish, 1.0mm thickness, 2oz copper for high current</text>
  <text x="20" y="449" class="small">• VBUS trace: minimum 2mm width (handles up to 3A at 12V)</text>
  <text x="20" y="461" class="small">• Peltier connector: JST XH 2-pin, rated for 3A</text>
  <text x="20" y="473" class="small">• Fan header: JST ZH 2-pin, 5V output (regulated from VBUS via 5V LDO)</text>
</svg>
