[package]
name = "cryo-core"
version = "0.1.0"
edition = "2021"
description = "Rust core engine — BLE parsing, dT/dt detection, notification logic"

[lib]
name = "cryo_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
thiserror = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
lto = true
opt-level = "z"
strip = true
