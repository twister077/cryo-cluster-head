# General
CONFIG_GPIO=y
CONFIG_PRINTK=y

# I2C (local MAX30205)
CONFIG_I2C=y
CONFIG_I2C_INIT_PRIORITY=60

# BLE Central (read patch + phone)
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_DEVICE_NAME="CryoCooler"
CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y

# PWM (Peltier control)
CONFIG_PWM=y

# Timer
CONFIG_COUNTER=y
CONFIG_ALARM=y

# ADC (battery monitoring)
CONFIG_ADC=y
