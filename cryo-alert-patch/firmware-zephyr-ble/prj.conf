# General
CONFIG_GPIO=y
CONFIG_PRINTK=y

# I2C (MAX30205)
CONFIG_I2C=y
CONFIG_I2C_INIT_PRIORITY=60

# BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="CryoPatch"
CONFIG_BT_DEVICE_APPEARANCE=0x0340
CONFIG_BT_MAX_CONN=1

# Power management
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_SYS_PM_DEEP_SLEEP_STATES=y

# Timer
CONFIG_COUNTER=y

# Battery monitoring
CONFIG_ADC=y

# Settings
CONFIG_SETTINGS=y
